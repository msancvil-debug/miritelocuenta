name: Auto Publicar Miri Te Lo Cuenta

on:
  schedule:
    - cron: '0 8 * * *' # Todos los días a las 8:00 AM
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install requests Pillow playwright

      - name: Instalar navegador Playwright (Chromium)
        run: |
          python -m playwright install --with-deps chromium

      - name: Ejecutar bot de publicaciones
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASS: ${{ secrets.WP_APP_PASS }}
        run: python miri_bot_html_modificado.py
